# ============================================================
# cooponboard - configuracion Quarkus (YAML)
# Requiere la extension quarkus-config-yaml.
#
# Fuentes de config (mayor prioridad gana):
#   variables de entorno (compose)  >  Vault  >  application.yml
#
# Secretos (credenciales de Postgres y MinIO) se OBTIENEN DE VAULT:
#   path KV: secret/dev/cooponboard/app
#   claves : quarkus.datasource.username/password,
#            quarkus.minio.access-key/secret-key
# Aqui NO se ponen credenciales; solo URLs y defaults de DEV.
# OJO: YAML usa 2 espacios de indentacion, nunca tabs.
# ============================================================
quarkus:
  application:
    name: cooponboard

  http:
    port: 8090

  # --- OpenAPI / Swagger UI (extension quarkus-smallrye-openapi) ---
  # Spec:       /q/openapi      UI: /q/swagger-ui
  smallrye-openapi:
    info-title: cooponboard API
    info-version: 1.0.0-SNAPSHOT
    info-description: API de onboarding del ecosistema CRM.
    info-contact-name: John Fredy Quimbaya Orozco
    info-contact-url: https://raziel214.github.io/portfolio/
  swagger-ui:
    always-include: true   # tambien disponible en prod (no solo en dev)

  # --- Persistencia PostgreSQL (credenciales via Vault) ---
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:cooponboard}
    password: ${DB_PASSWORD:cooponboard}
  hibernate-orm:
    database:
      generation: update

  # --- Seguridad: OIDC contra Keycloak (modo service = valida JWT Bearer) ---
  # Realm = ambiente (dev). cooponboard-api = resource server / audience.
  oidc:
    application-type: service
    client-id: cooponboard-api
    token:
      audience: cooponboard-api   # exige que el JWT lleve aud=cooponboard-api
  # Usamos nuestro Keycloak, no el Dev Service automatico
  keycloak:
    devservices:
      enabled: false

  # --- MinIO (url aqui; access-key/secret-key via Vault) ---
  # quarkus.minio.url se define por perfil/entorno mas abajo.
  minio:
    bucket: onboarding-documents

  # --- Vault: fuente de secretos ---
  vault:
    kv-secret-engine-version: 2
    kv-secret-engine-mount-path: secret
    secret-config-kv-path: dev/cooponboard/app
    authentication:
      userpass:
        username: ${VAULT_USERNAME:cooponboard-app}
        password: ${VAULT_PASSWORD:}   # sin default; viene de .env / entorno

  # --- Observabilidad y Metricas ---
  micrometer:
    export:
      prometheus:
        enabled: true
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317

  # --- Logging ---
  log:
    console:
      enable: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n"
    level: INFO
    category:
      "com.quimbaya.cooponboard":
        level: DEBUG

# ------------------------------------------------------------
# DEV local ('mvnw quarkus:dev' corre en el host -> localhost).
# En contenedor, el compose inyecta las URLs por variables de
# entorno (QUARKUS_*) apuntando a los nombres de contenedor.
# ------------------------------------------------------------
"%dev":
  quarkus:
    datasource:
      jdbc:
        url: jdbc:postgresql://localhost:5432/cooponboard
    oidc:
      auth-server-url: http://localhost:8081/realms/internos-dev
    minio:
      url: http://localhost:9000
    vault:
      url: http://localhost:8200
    otel:
      sdk:
        disabled: true # Deshabilitar OpenTelemetry en DEV para evitar errores si Collector no corre

